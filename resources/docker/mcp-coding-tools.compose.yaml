import os, json
from starlette.applications import Starlette
from starlette.routing import Route
from starlette.requests import Request
from starlette.responses import JSONResponse

WORKSPACE = os.environ.get(\"WORKSPACE\", \"/workspace\")

def safe_path(filepath):
    if filepath.startswith(\"/\"):
        full = filepath
    else:
        full = os.path.join(WORKSPACE, filepath)
    real = os.path.realpath(full)
    ws_real = os.path.realpath(WORKSPACE)
    if not real.startswith(ws_real):
        raise ValueError(\"Path outside workspace: \" + filepath)
    return real

def make_response(req_id, result):
    return JSONResponse({\"jsonrpc\": \"2.0\", \"id\": req_id, \"result\": result})

async def handle_mcp(request: Request):
    body = await request.json()
    method = body.get(\"method\", \"\")
    req_id = body.get(\"id\")

    if method == \"initialize\":
        return make_response(req_id, {
            \"protocolVersion\": \"2026-02-28\",
            \"capabilities\": {\"tools\": {\"listChanged\": False}},
            \"serverInfo\": {\"name\": \"file-editor-mcp\", \"version\": \"1.0.0\"}
        })
    elif method == \"notifications/initialized\":
        return JSONResponse(None, status_code=204)
    elif method == \"tools/list\":
        return make_response(req_id, {\"tools\": [
            {\"name\": \"read_file\", \"description\": \"Read file content with optional line range\",
             \"inputSchema\": {\"type\": \"object\", \"properties\": {\"path\": {\"type\": \"string\", \"description\": \"File path relative to workspace\"}, \"start_line\": {\"type\": \"number\", \"description\": \"Start line (1-based, optional)\"}, \"end_line\": {\"type\": \"number\", \"description\": \"End line (optional)\"}}, \"required\": [\"path\"]}},
            {\"name\": \"write_file\", \"description\": \"Write content to a file\",
             \"inputSchema\": {\"type\": \"object\", \"properties\": {\"path\": {\"type\": \"string\", \"description\": \"File path\"}, \"content\": {\"type\": \"string\", \"description\": \"Content to write\"}}, \"required\": [\"path\", \"content\"]}},
            {\"name\": \"edit_file\", \"description\": \"Replace text in a file (search and replace)\",
             \"inputSchema\": {\"type\": \"object\", \"properties\": {\"path\": {\"type\": \"string\", \"description\": \"File path\"}, \"search\": {\"type\": \"string\", \"description\": \"Text to search for\"}, \"replace\": {\"type\": \"string\", \"description\": \"Replacement text\"}}, \"required\": [\"path\", \"search\", \"replace\"]}},
            {\"name\": \"list_directory\", \"description\": \"List files and directories\",
             \"inputSchema\": {\"type\": \"object\", \"properties\": {\"path\": {\"type\": \"string\", \"description\": \"Directory path (default: workspace root)\"}}, \"required\": []}},
            {\"name\": \"create_directory\", \"description\": \"Create a directory recursively\",
             \"inputSchema\": {\"type\": \"object\", \"properties\": {\"path\": {\"type\": \"string\", \"description\": \"Directory path to create\"}}, \"required\": [\"path\"]}},
            {\"name\": \"delete_file\", \"description\": \"Delete a file\",
             \"inputSchema\": {\"type\": \"object\", \"properties\": {\"path\": {\"type\": \"string\", \"description\": \"File path to delete\"}}, \"required\": [\"path\"]}},
            {\"name\": \"append_file\", \"description\": \"Append content to a file\",
             \"inputSchema\": {\"type\": \"object\", \"properties\": {\"path\": {\"type\": \"string\", \"description\": \"File path\"}, \"content\": {\"type\": \"string\", \"description\": \"Content to append\"}}, \"required\": [\"path\", \"content\"]}},
            {\"name\": \"search_in_file\", \"description\": \"Search for text pattern in a file, return matching lines\",
             \"inputSchema\": {\"type\": \"object\", \"properties\": {\"path\": {\"type\": \"string\", \"description\": \"File path\"}, \"query\": {\"type\": \"string\", \"description\": \"Search text\"}}, \"required\": [\"path\", \"query\"]}},
        ]})
    elif method == \"tools/call\":
        params = body.get(\"params\", {})
        name = params.get(\"name\", \"\")
        args = params.get(\"arguments\", {})
        try:
            text = dispatch_tool(name, args)
            return make_response(req_id, {\"content\": [{\"type\": \"text\", \"text\": text}], \"isError\": False})
        except Exception as e:
            return make_response(req_id, {\"content\": [{\"type\": \"text\", \"text\": f\"Error: {e}\"}], \"isError\": True})
    return JSONResponse({\"jsonrpc\": \"2.0\", \"id\": req_id, \"error\": {\"code\": -32601, \"message\": \"Unknown method\"}})

def dispatch_tool(name, args):
    if name == \"read_file\":
        p = safe_path(args[\"path\"])
        start = int(args.get(\"start_line\", 1))
        end = args.get(\"end_line\")
        with open(p, \"r\", encoding=\"utf-8\", errors=\"replace\") as f:
            lines = f.readlines()
        selected = lines[start - 1:(int(end) if end else len(lines))]
        numbered = [f\"{start + i}: {line.rstrip()}\" for i, line in enumerate(selected)]
        return \"\\n\".join(numbered)
    elif name == \"write_file\":
        p = safe_path(args[\"path\"])
        os.makedirs(os.path.dirname(p), exist_ok=True)
        with open(p, \"w\", encoding=\"utf-8\") as f:
            f.write(args[\"content\"])
        return \"File written: \" + args[\"path\"]
    elif name == \"edit_file\":
        p = safe_path(args[\"path\"])
        with open(p, \"r\", encoding=\"utf-8\") as f:
            content = f.read()
        count = content.count(args[\"search\"])
        if count == 0:
            return \"No matches found for search text\"
        content = content.replace(args[\"search\"], args[\"replace\"])
        with open(p, \"w\", encoding=\"utf-8\") as f:
            f.write(content)
        return f\"Replaced {count} occurrence(s) in {args['path']}\"
    elif name == \"list_directory\":
        rel = args.get(\"path\", \".\")
        p = safe_path(rel)
        entries = sorted(os.listdir(p))
        result = []
        for e in entries:
            full = os.path.join(p, e)
            prefix = \"DIR \" if os.path.isdir(full) else \"FILE\"
            size = os.path.getsize(full) if os.path.isfile(full) else 0
            result.append(f\"{prefix} {e} ({size} bytes)\" if size else f\"{prefix} {e}\")
        return \"\\n\".join(result) if result else \"(empty directory)\"
    elif name == \"create_directory\":
        p = safe_path(args[\"path\"])
        os.makedirs(p, exist_ok=True)
        return \"Directory created: \" + args[\"path\"]
    elif name == \"delete_file\":
        p = safe_path(args[\"path\"])
        os.remove(p)
        return \"File deleted: \" + args[\"path\"]
    elif name == \"append_file\":
        p = safe_path(args[\"path\"])
        os.makedirs(os.path.dirname(p), exist_ok=True)
        with open(p, \"a\", encoding=\"utf-8\") as f:
            f.write(args[\"content\"])
        return \"Content appended to: \" + args[\"path\"]
    elif name == \"search_in_file\":
        p = safe_path(args[\"path\"])
        query = args[\"query\"]
        matches = []
        with open(p, \"r\", encoding=\"utf-8\", errors=\"replace\") as f:
            for i, line in enumerate(f, 1):
                if query.lower() in line.lower():
                    matches.append(f\"{i}: {line.rstrip()}\")
        return \"\\n\".join(matches) if matches else \"No matches found\"
    return f\"Unknown tool: {name}\"

app = Starlette(routes=[Route(\"/mcp\", handle_mcp, methods=[\"POST\"])])
import uvicorn
uvicorn.run(app, host=\"0.0.0.0\", port=9101)

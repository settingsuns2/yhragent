# ragent MCP Coding Tools Stack
# 编程工具服务编排：命令行执行 + Python代码沙箱 + 文件编辑器
#
# 使用方式:
#   docker compose -f mcp-coding-tools.compose.yaml up -d
#
# 前置条件:
#   - Docker 已安装并运行
#   - Docker Compose V2+
#
# 服务端口:
#   - 9100: Terminal 命令执行服务
#   - 8181: Python 代码解释器服务
#   - 9101: 文件编辑器服务

services:
  mcp-terminal:
    image: python:3.12-slim
    container_name: ragent-mcp-terminal
    working_dir: /app
    ports:
      - "9100:9100"
    environment:
      - PYTHONUNBUFFERED=1
      - WORKSPACE=/workspace
    volumes:
      - ${WORKSPACE_DIR:-/tmp/ragent-workspace}:/workspace
    command: >
      bash -c "
        pip install --no-cache-dir mcp starlette uvicorn &&
        python -c '
import os, subprocess, sys, json
from mcp.server import Server
from mcp.types import Tool, TextContent
from starlette.applications import Starlette
from starlette.routing import Route
from starlette.requests import Request
from starlette.responses import JSONResponse
import asyncio

WORKSPACE = os.environ.get(\"WORKSPACE\", \"/workspace\")
rpc_id = 0

server = Server(\"terminal\")

@server.list_tools()
async def list_tools():
    return [
        Tool(
            name=\"execute_command\",
            description=\"Execute a shell command and return stdout/stderr\",
            inputSchema={
                \"type\": \"object\",
                \"properties\": {
                    \"command\": {\"type\": \"string\", \"description\": \"Shell command to execute\"},
                    \"timeout\": {\"type\": \"number\", \"description\": \"Timeout in seconds (default 60)\"}
                },
                \"required\": [\"command\"]
            }
        ),
        Tool(
            name=\"execute_background\",
            description=\"Start a command in the background and return process ID\",
            inputSchema={
                \"type\": \"object\",
                \"properties\": {
                    \"command\": {\"type\": \"string\", \"description\": \"Shell command to start in background\"}
                },
                \"required\": [\"command\"]
            }
        ),
        Tool(
            name=\"list_processes\",
            description=\"List running background processes\",
            inputSchema={\"type\": \"object\", \"properties\": {}}
        ),
    ]

bg_processes = {}

@server.call_tool()
async def call_tool(name, arguments):
    if name == \"execute_command\":
        cmd = arguments.get(\"command\", \"\")
        timeout = int(arguments.get(\"timeout\", 60))
        try:
            result = subprocess.run(
                cmd, shell=True, capture_output=True, text=True,
                timeout=timeout, cwd=WORKSPACE
            )
            output = result.stdout or \"(no stdout)\"
            if result.stderr:
                output += \"\\nSTDERR:\\n\" + result.stderr
            if result.returncode != 0:
                output += f\"\\nExit code: {result.returncode}\"
            return [TextContent(type=\"text\", text=output)]
        except subprocess.TimeoutExpired:
            return [TextContent(type=\"text\", text=f\"Error: Command timed out after {timeout}s\")]
        except Exception as e:
            return [TextContent(type=\"text\", text=f\"Error: {e}\")]
    elif name == \"execute_background\":
        cmd = arguments.get(\"command\", \"\")
        try:
            proc = subprocess.Popen(
                cmd, shell=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                cwd=WORKSPACE
            )
            bg_processes[str(proc.pid)] = proc
            return [TextContent(type=\"text\", text=f\"Process started with PID: {proc.pid}\")]
        except Exception as e:
            return [TextContent(type=\"text\", text=f\"Error: {e}\")]
    elif name == \"list_processes\":
        lines = []
        for pid, proc in list(bg_processes.items()):
            running = \"RUNNING\" if proc.poll() is None else f\"EXIT({proc.returncode})\"
            lines.append(f\"PID {pid}: {running}\")
            if not running.startswith(\"RUNNING\"):
                del bg_processes[pid]
        return [TextContent(type=\"text\", text=\"\\n\".join(lines) if lines else \"No background processes\")]
    return [TextContent(type=\"text\", text=\"Unknown tool\")]

async def handle_mcp(request: Request):
    body = await request.json()
    method = body.get(\"method\", \"\")
    req_id = body.get(\"id\")

    if method == \"initialize\":
        return JSONResponse({
            \"jsonrpc\": \"2.0\", \"id\": req_id,
            \"result\": {
                \"protocolVersion\": \"2026-02-28\",
                \"capabilities\": {\"tools\": {\"listChanged\": False}},
                \"serverInfo\": {\"name\": \"terminal-mcp\", \"version\": \"1.0.0\"}
            }
        })
    elif method == \"notifications/initialized\":
        return JSONResponse(None, status_code=204)
    elif method == \"tools/list\":
        tools = await server.list_tools()
        tool_schemas = []
        for t in tools:
            tool_schemas.append({\"name\": t.name, \"description\": t.description, \"inputSchema\": t.inputSchema})
        return JSONResponse({\"jsonrpc\": \"2.0\", \"id\": req_id, \"result\": {\"tools\": tool_schemas}})
    elif method == \"tools/call\":
        params = body.get(\"params\", {})
        tool_name = params.get(\"name\", \"\")
        args = params.get(\"arguments\", {})
        result = await server.call_tool(tool_name, args)
        content = [{\"type\": c.type, \"text\": c.text} for c in result]
        return JSONResponse({\"jsonrpc\": \"2.0\", \"id\": req_id, \"result\": {\"content\": content, \"isError\": False}})
    return JSONResponse({\"jsonrpc\": \"2.0\", \"id\": req_id, \"error\": {\"code\": -32601, \"message\": \"Unknown method\"}})

app = Starlette(routes=[Route(\"/mcp\", handle_mcp, methods=[\"POST\"])])
import uvicorn
uvicorn.run(app, host=\"0.0.0.0\", port=9100)

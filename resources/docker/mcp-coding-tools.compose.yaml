import os, subprocess, sys, json, uuid
from starlette.applications import Starlette
from starlette.routing import Route
from starlette.requests import Request
from starlette.responses import JSONResponse

WORKSPACE = os.environ.get(\"WORKSPACE\", \"/workspace\")

contexts = {}

def make_response(req_id, result):
    return JSONResponse({\"jsonrpc\": \"2.0\", \"id\": req_id, \"result\": result})

def make_error(req_id, code, msg):
    return JSONResponse({\"jsonrpc\": \"2.0\", \"id\": req_id, \"error\": {\"code\": code, \"message\": msg}})

async def handle_mcp(request: Request):
    body = await request.json()
    method = body.get(\"method\", \"\")
    req_id = body.get(\"id\")

    if method == \"initialize\":
        return make_response(req_id, {
            \"protocolVersion\": \"2026-02-28\",
            \"capabilities\": {\"tools\": {\"listChanged\": False}},
            \"serverInfo\": {\"name\": \"code-interpreter-mcp\", \"version\": \"1.0.0\"}
        })
    elif method == \"notifications/initialized\":
        return JSONResponse(None, status_code=204)
    elif method == \"tools/list\":
        return make_response(req_id, {\"tools\": [
            {\"name\": \"execute_python\", \"description\": \"Execute Python code and return output\",
             \"inputSchema\": {\"type\": \"object\", \"properties\": {\"code\": {\"type\": \"string\", \"description\": \"Python code to execute\"}, \"context_id\": {\"type\": \"string\", \"description\": \"Optional context ID for stateful execution\"}}, \"required\": [\"code\"]}},
            {\"name\": \"install_package\", \"description\": \"Install a Python package via pip\",
             \"inputSchema\": {\"type\": \"object\", \"properties\": {\"package\": {\"type\": \"string\", \"description\": \"Package name (e.g. numpy, pandas)\"}}, \"required\": [\"package\"]}},
            {\"name\": \"execute_shell\", \"description\": \"Execute a shell command in the workspace\",
             \"inputSchema\": {\"type\": \"object\", \"properties\": {\"command\": {\"type\": \"string\", \"description\": \"Shell command\"}}, \"required\": [\"command\"]}},
            {\"name\": \"create_context\", \"description\": \"Create a new Python execution context (virtual environment)\",
             \"inputSchema\": {\"type\": \"object\", \"properties\": {}, \"required\": []}},
            {\"name\": \"list_contexts\", \"description\": \"List all execution contexts\",
             \"inputSchema\": {\"type\": \"object\", \"properties\": {}, \"required\": []}},
        ]})
    elif method == \"tools/call\":
        params = body.get(\"params\", {})
        tool_name = params.get(\"name\", \"\")
        args = params.get(\"arguments\", {})
        try:
            text = dispatch_tool(tool_name, args)
            return make_response(req_id, {\"content\": [{\"type\": \"text\", \"text\": text}], \"isError\": False})
        except Exception as e:
            return make_response(req_id, {\"content\": [{\"type\": \"text\", \"text\": f\"Error: {e}\"}], \"isError\": True})
    return make_error(req_id, -32601, \"Unknown method\")

def dispatch_tool(name, args):
    if name == \"execute_python\":
        code = args.get(\"code\", \"\")
        ctx_id = args.get(\"context_id\")
        env = dict(os.environ)
        if ctx_id and ctx_id in contexts:
            env[\"VIRTUAL_ENV\"] = contexts[ctx_id]
            env[\"PATH\"] = os.path.join(contexts[ctx_id], \"bin\") + \":\" + os.environ.get(\"PATH\", \"\")
        result = subprocess.run(
            [sys.executable, \"-c\", code],
            capture_output=True, text=True, timeout=120, cwd=WORKSPACE, env=env
        )
        output = result.stdout or \"\"
        if result.stderr:
            output += \"\\nSTDERR: \" + result.stderr
        if result.returncode != 0:
            output += f\"\\nExit code: {result.returncode}\"
        return output
    elif name == \"install_package\":
        pkg = args.get(\"package\", \"\")
        result = subprocess.run(
            [sys.executable, \"-m\", \"pip\", \"install\", \"--no-cache-dir\", pkg],
            capture_output=True, text=True, timeout=180
        )
        return result.stdout + (\"\\n\" + result.stderr if result.stderr else \"\")
    elif name == \"execute_shell\":
        cmd = args.get(\"command\", \"\")
        result = subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=120, cwd=WORKSPACE)
        output = result.stdout or \"\"
        if result.stderr:
            output += \"\\nSTDERR: \" + result.stderr
        return output
    elif name == \"create_context\":
        ctx_id = str(uuid.uuid4())[:8]
        ctx_path = os.path.join(\"/tmp\", \"ctx_\" + ctx_id)
        subprocess.run([sys.executable, \"-m\", \"venv\", ctx_path], capture_output=True, timeout=30)
        contexts[ctx_id] = ctx_path
        return f\"Context created: {ctx_id}\"
    elif name == \"list_contexts\":
        if not contexts:
            return \"No contexts. Default uses system Python.\"
        return \"\\n\".join(f\"{k}: {v}\" for k, v in contexts.items())
    return f\"Unknown tool: {name}\"

app = Starlette(routes=[Route(\"/mcp\", handle_mcp, methods=[\"POST\"])])
import uvicorn
uvicorn.run(app, host=\"0.0.0.0\", port=8181)
